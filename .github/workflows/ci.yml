name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  model-quality-gate:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: data/urls.csv
          key: dataset-3243f054
      - name: Train on a sample and fail if PR-AUC drops below 0.90
        run: python -m urlguard.train --sample 40000 --min-pr-auc 0.90 --skip-random-split
      - uses: actions/upload-artifact@v4
        with:
          name: model-report
          path: reports/

  docker:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: urlguard:ci
          build-args: TRAIN_SAMPLE=40000
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the container
        run: |
          docker run -d --name api -p 8000:8000 urlguard:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/predict -H 'content-type: application/json' \
               -d '{"url":"paypal.com.secure-login.tk/webscr?cmd=_login"}' | tee out.json
          grep -q '"verdict"' out.json
          docker logs api
