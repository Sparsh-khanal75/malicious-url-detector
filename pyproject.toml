[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urlguard"
version = "1.0.0"
description = "Malicious URL detection: stacked char n-gram + lexical model, served with FastAPI"
requires-python = ">=3.10"
dependencies = [
  "scikit-learn>=1.4,<1.10", "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "joblib>=1.3",
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "prometheus-client>=0.20", "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905"]
